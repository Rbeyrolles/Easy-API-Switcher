<div id="easyswitch-settings" class="extension_container easyswitch-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Easy API Switcher</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="easyswitch-hide-test-message">
                <input id="easyswitch-hide-test-message" type="checkbox">
                <span data-i18n="Hide Test Message button">Hide Test Message button</span>
            </label>
            <small class="easyswitch-setting-description" data-i18n="Hides SillyTavern's native Test Message button in API Connections. This does not affect API connections or chat.">
                Hides SillyTavern's native Test Message button in API Connections. This does not affect API connections or chat.
            </small>
        </div>
    </div>
</div>
